<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Green Farm Fortune</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    /* ============================================================
       DASHBOARD SPECIFIC STYLES
       ============================================================ */
    .gff-container {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px;
    }

    /* --- Wallet Card --- */
    .gff-wallet {
      background: linear-gradient(135deg, var(--gff-blue) 0%, var(--gff-blue-dark) 100%);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      color: white;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    .gff-wallet::after {
      content: ''; position: absolute; top: -40px; right: -40px;
      width: 150px; height: 150px;
      background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, transparent 70%);
      border-radius: 50%;
    }
    .gff-wallet-label {
      font-size: 13px; opacity: 0.85; margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .gff-wallet-label button {
      background: none; border: none; color: white; cursor: pointer; padding: 0; display: flex;
    }
    .gff-wallet-label button svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
    
    .gff-wallet-balance {
      font-family: 'Fraunces', serif;
      font-size: 42px; font-weight: 800;
      margin-bottom: 20px; letter-spacing: -1px;
    }
    .gff-wallet-actions { display: flex; gap: 12px; }
    .gff-btn {
      flex: 1; padding: 14px; border-radius: 14px;
      font-weight: 700; font-size: 14px; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit; transition: transform 0.2s;
    }
    .gff-btn:active { transform: scale(0.96); }
    .gff-btn-gold { background: var(--gff-gold); color: var(--gff-blue-dark); }
    .gff-btn-outline { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); }

    /* --- Stats Row --- */
    .gff-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
      margin-bottom: 24px;
    }
    .gff-stat-card {
      background: var(--white); padding: 16px 12px;
      border-radius: var(--radius-md); text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .gff-stat-val {
      font-family: 'Fraunces', serif; font-size: 16px; font-weight: 700;
      margin-bottom: 4px;
    }
    .gff-stat-lbl { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .gff-stat-card:nth-child(1) .gff-stat-val { color: var(--gff-blue); }
    .gff-stat-card:nth-child(2) .gff-stat-val { color: var(--gff-green); }
    .gff-stat-card:nth-child(3) .gff-stat-val { color: var(--gff-gold-dark); }

    /* --- Sectors Banner --- */
    .gff-sectors {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      border-left: 4px solid var(--gff-green);
    }
    .gff-sectors-title {
      font-size: 12px; font-weight: 700; color: var(--gff-blue);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;
    }
    .gff-sectors-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    }
    .gff-sector-item {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 600; color: var(--text-muted); text-align: center;
    }
    .gff-sector-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: #F0FDF4; display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    /* --- Quick Actions --- */
    .gff-actions-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      margin-bottom: 24px;
    }
    .gff-action-item {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer;
    }
    .gff-action-icon {
      width: 52px; height: 52px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      background: var(--white); box-shadow: var(--shadow-sm);
      transition: transform 0.2s;
    }
    .gff-action-item:active .gff-action-icon { transform: scale(0.92); }
    .gff-action-icon svg { width: 24px; height: 24px; stroke-width: 2; fill: none; }
    .gff-action-item:nth-child(1) .gff-action-icon svg { stroke: var(--gff-blue); }
    .gff-action-item:nth-child(2) .gff-action-icon svg { stroke: var(--gff-green); }
    .gff-action-item:nth-child(3) .gff-action-icon svg { stroke: var(--gff-gold-dark); }
    .gff-action-item:nth-child(4) .gff-action-icon svg { stroke: var(--gff-red); }
    .gff-action-label { font-size: 11px; font-weight: 600; color: var(--text-dark); }

    /* --- Section Header --- */
    .gff-section-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .gff-section-title {
      font-family: 'Fraunces', serif; font-size: 18px; font-weight: 700; color: var(--gff-blue-dark);
    }
    .gff-see-all { font-size: 13px; color: var(--gff-blue); font-weight: 700; text-decoration: none; }

    /* --- Active Farms (Investments) --- */
    .gff-farm-card {
      background: var(--white); border-radius: var(--radius-md);
      padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
      border-top: 3px solid var(--gff-green);
    }
    .gff-farm-head {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .gff-farm-name { font-weight: 700; color: var(--gff-blue-dark); font-size: 15px; }
    .gff-farm-badge {
      background: #DCFCE7; color: #166534; padding: 4px 10px;
      border-radius: 12px; font-size: 11px; font-weight: 700;
    }
    .gff-farm-progress {
      background: #F3F4F6; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 10px;
    }
    .gff-farm-bar {
      height: 100%; background: linear-gradient(90deg, var(--gff-green), var(--gff-green-light));
      border-radius: 3px;
    }
    .gff-farm-foot {
      display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted);
    }
    .gff-farm-earning { font-weight: 700; color: var(--gff-green); font-size: 14px; }

    /* Empty State */
    .gff-empty {
      text-align: center; padding: 30px 20px; background: var(--white);
      border-radius: var(--radius-md); border: 2px dashed #E5E7EB;
    }
    .gff-empty p { color: var(--text-muted); margin-bottom: 16px; font-size: 14px; }
    .gff-empty-btn {
      background: var(--gff-blue); color: white; border: none;
      padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer;
    }

    #toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: var(--gff-blue-dark); color: white; padding: 12px 24px;
      border-radius: 25px; font-size: 14px; font-weight: 600; z-index: 1000;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- Shared Header Placeholder -->
  <div id="app-header"></div>

  <div class="gff-container">
    
    <!-- Wallet Card -->
    <div class="gff-wallet">
      <div class="gff-wallet-label">
        Total Balance
        <button onclick="toggleBalance()">
          <svg viewBox="0 0 24 24" id="eyeIcon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="gff-wallet-balance" id="walletBalance">₦0.00</div>
      <div class="gff-wallet-actions">
        <button class="gff-btn gff-btn-gold" onclick="window.location.href='/recharge'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Deposit
        </button>
        <button class="gff-btn gff-btn-outline" onclick="window.location.href='/withdraw'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          Withdraw
        </button>
      </div>
    </div>

    <!-- Stats Row -->
    <div class="gff-stats">
      <div class="gff-stat-card">
        <div class="gff-stat-val" id="statDeposit">₦0</div>
        <div class="gff-stat-lbl">Deposited</div>
      </div>
      <div class="gff-stat-card">
        <div class="gff-stat-val" id="statProfit">₦0</div>
        <div class="gff-stat-lbl">Profit</div>
      </div>
      <div class="gff-stat-card">
        <div class="gff-stat-val" id="statReferral">₦0</div>
        <div class="gff-stat-lbl">Referral</div>
      </div>
    </div>

    <!-- Sectors Banner -->
    <div class="gff-sectors">
      <div class="gff-sectors-title">We Invest In Quality Assets</div>
      <div class="gff-sectors-grid">
        <div class="gff-sector-item">
          <div class="gff-sector-icon">🌾</div>
          <span>Crop</span>
        </div>
        <div class="gff-sector-item">
          <div class="gff-sector-icon">🐄</div>
          <span>Livestock</span>
        </div>
        <div class="gff-sector-item">
          <div class="gff-sector-icon">🐔</div>
          <span>Poultry</span>
        </div>
        <div class="gff-sector-item">
          <div class="gff-sector-icon">🏡</div>
          <span>Greenhouse</span>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="gff-actions-grid">
      <div class="gff-action-item" onclick="window.location.href='/VIP'">
        <div class="gff-action-icon">
          <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        </div>
        <div class="gff-action-label">Invest</div>
      </div>
      <div class="gff-action-item" onclick="window.location.href='/team'">
        <div class="gff-action-icon">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        </div>
        <div class="gff-action-label">Team</div>
      </div>
      <div class="gff-action-item" onclick="window.location.href='/gift-code'">
        <div class="gff-action-icon">
          <svg viewBox="0 0 24 24"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/></svg>
        </div>
        <div class="gff-action-label">Gift Code</div>
      </div>
      <div class="gff-action-item" onclick="window.location.href='/transaction-history'">
        <div class="gff-action-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="gff-action-label">History</div>
      </div>
    </div>

    <!-- Active Investments -->
    <div class="gff-section-head">
      <div class="gff-section-title">My Active Farms</div>
      <a href="/investment" class="gff-see-all">View All</a>
    </div>
    
    <div id="activeInvestments">
      <div class="gff-empty">
        <p>No active farms yet. Start growing your fortune!</p>
        <button class="gff-empty-btn" onclick="window.location.href='/VIP'">Invest Now</button>
      </div>
    </div>

  </div>

  <!-- Shared Footer Placeholder -->
  <div id="app-footer"></div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    // Toggle Balance Visibility
    let balanceVisible = true;
    function toggleBalance() {
      balanceVisible = !balanceVisible;
      const el = document.getElementById('walletBalance');
      const icon = document.getElementById('eyeIcon');
      if (balanceVisible) {
        el.textContent = el.dataset.original || '₦0.00';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      } else {
        el.dataset.original = el.textContent;
        el.textContent = '₦••••••';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      }
    }

    // Load Data
    document.addEventListener('DOMContentLoaded', async function() {
      const session = await AradelAuth.getSession();
      if (!session) { window.location.href = '/'; return; }

      const uid = session.user.id;
      const { data: profile } = await window.sb.from('users').select('*').eq('id', uid).single();
      const { data: wallet } = await window.sb.from('wallets').select('*').eq('user_id', uid).single();

      if (profile) {
        // Populate shared header
        const nameEl = document.getElementById('headerUserName');
        const vipEl = document.getElementById('headerUserVip');
        if (nameEl) nameEl.textContent = profile.full_name.split(' ')[0];
        if (vipEl) vipEl.textContent = profile.vip_level > 0 ? `VIP ${profile.vip_level}` : 'Member';
      }

      if (wallet) {
        const bal = '₦' + Number(wallet.balance).toLocaleString();
        const balEl = document.getElementById('walletBalance');
        balEl.textContent = bal;
        balEl.dataset.original = bal;
        
        document.getElementById('statDeposit').textContent = '₦' + Number(wallet.total_deposit || 0).toLocaleString();
        document.getElementById('statProfit').textContent = '₦' + Number(wallet.total_profit || 0).toLocaleString();
        document.getElementById('statReferral').textContent = '₦' + Number(wallet.total_referral_earnings || 0).toLocaleString();
      }

      // Fetch Active Investments
      const { data: investments } = await window.sb
        .from('user_products')
        .select('*, products(name, duration_days)')
        .eq('user_id', uid)
        .eq('status', 'active')
        .limit(3);

      if (investments && investments.length > 0) {
        const container = document.getElementById('activeInvestments');
        container.innerHTML = investments.map(inv => {
          const duration = inv.products?.duration_days || 30;
          const progress = Math.min(100, ((inv.days_collected || 0) / duration) * 100);
          return `
            <div class="gff-farm-card">
              <div class="gff-farm-head">
                <div class="gff-farm-name">${inv.products?.name || 'VIP Plan'}</div>
                <div class="gff-farm-badge">Growing</div>
              </div>
              <div class="gff-farm-progress">
                <div class="gff-farm-bar" style="width: ${progress}%"></div>
              </div>
              <div class="gff-farm-foot">
                <span>${inv.days_collected || 0}/${duration} days</span>
                <div class="gff-farm-earning">+₦${Number(inv.daily_income).toLocaleString()}/day</div>
              </div>
            </div>
          `;
        }).join('');
      }

      // Check unread messages for shared header badge
      const { count } = await window.sb
        .from('messages')
        .select('*', { count: 'exact', head: true })
        .eq('recipient_id', uid)
        .eq('is_read', false);

      if (count > 0) {
        const badge = document.getElementById('headerMsgBadge');
        if (badge) badge.style.display = 'block';
      }
    });
  </script>
</body>
</html>
