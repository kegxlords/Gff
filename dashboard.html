<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Green Farm Fortune</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    /* Dashboard Specific Styles */
    .page-wrap { max-width: 520px; margin: 0 auto; padding-bottom: 100px; }
    
    .app-header {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
    }
    .greeting-eyebrow { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .greeting-name { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 700; color: var(--text-dark); margin-top: 2px; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .vip-badge {
      font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 20px;
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-dark));
      color: var(--primary-blue-dark); box-shadow: var(--shadow-gold);
    }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px; background: var(--white);
      border: 1px solid var(--border-light); display: flex; align-items: center; justify-content: center;
      color: var(--text-dark); position: relative; cursor: pointer;
    }
    .notif-dot {
      position: absolute; top: 8px; right: 8px; width: 8px; height: 8px;
      background: var(--accent-red); border-radius: 50%; border: 2px solid var(--white);
    }

    .hero-card {
      margin: 20px; padding: 28px 24px; border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-dark) 100%);
      color: var(--white); box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
    }
    .hero-card::before {
      content: ''; position: absolute; top: -40px; right: -40px; width: 150px; height: 150px;
      background: rgba(255, 215, 0, 0.15); border-radius: 50%;
    }
    .hero-label { font-size: 13px; font-weight: 600; opacity: 0.85; letter-spacing: 0.05em; text-transform: uppercase; }
    .hero-amount { font-family: 'Fraunces', serif; font-size: 36px; font-weight: 800; margin: 8px 0 16px; }
    .hero-actions { display: flex; gap: 12px; margin-top: 20px; }
    .hero-btn {
      flex: 1; padding: 14px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px;
      display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    }
    .hero-btn.fill { background: var(--white); color: var(--primary-blue); }
    .hero-btn.ghost { background: rgba(255, 255, 255, 0.15); color: var(--white); border: 1px solid rgba(255, 255, 255, 0.3); }

    .section { padding: 0 20px; margin-bottom: 24px; }
    .section-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 700; margin-bottom: 14px; color: var(--text-dark); }
    
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-box {
      background: var(--white); border-radius: var(--radius-md); padding: 18px;
      border: 1px solid var(--border-light); box-shadow: var(--shadow-sm);
    }
    .stat-icon {
      width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 10px;
    }
    .stat-icon.deposit { background: var(--primary-blue-light); color: var(--primary-blue); }
    .stat-icon.profit { background: var(--success-green-bg); color: var(--success-green); }
    .stat-val { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; color: var(--text-dark); }
    .stat-lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }

    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .quick-item {
      display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px;
      background: var(--white); border-radius: var(--radius-md); border: 1px solid var(--border-light);
      cursor: pointer; text-align: center; transition: transform 0.2s;
    }
    .quick-item:active { transform: scale(0.95); }
    .quick-icon {
      width: 40px; height: 40px; border-radius: 12px; background: var(--primary-blue-light);
      display: flex; align-items: center; justify-content: center; color: var(--primary-blue);
    }
    .quick-label { font-size: 11px; font-weight: 600; color: var(--text-dark); }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; max-width: 520px; margin: 0 auto;
      background: var(--white); border-top: 1px solid var(--border-light);
      display: flex; justify-content: space-around; padding: 12px 0 20px; z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .nav-item.active { color: var(--primary-blue); }
    .nav-item.active svg { stroke: var(--primary-blue); }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div id="app-header"></div>

    <!-- Hero Wallet Card -->
    <section class="hero-card">
      <div class="hero-label">Total Balance</div>
      <div class="hero-amount" id="walletBalance">₦0.00</div>
      <div class="hero-actions">
        <button class="hero-btn fill" onclick="window.location.href='/recharge'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Deposit
        </button>
        <button class="hero-btn ghost" onclick="window.location.href='/withdraw'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          Withdraw
        </button>
      </div>
    </section>

    <!-- Stats Row -->
    <section class="section">
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-icon deposit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </div>
          <div class="stat-val" id="statDeposit">₦0</div>
          <div class="stat-lbl">Total Deposit</div>
        </div>
        <div class="stat-box">
          <div class="stat-icon profit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 17"/><polyline points="17 6 23 6 23 12"/></svg>
          </div>
          <div class="stat-val" id="statProfit">₦0</div>
          <div class="stat-lbl">Total Profit</div>
        </div>
      </div>
    </section>

    <!-- Quick Actions -->
    <section class="section">
      <div class="section-title">Quick Actions</div>
      <div class="quick-grid">
        <div class="quick-item" onclick="window.location.href='/recharge'">
          <div class="quick-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
          <div class="quick-label">Deposit</div>
        </div>
        <div class="quick-item" onclick="window.location.href='/withdraw'">
          <div class="quick-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
          <div class="quick-label">Withdraw</div>
        </div>
        <div class="quick-item" onclick="window.location.href='/team'">
          <div class="quick-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
          <div class="quick-label">Team</div>
        </div>
        <div class="quick-item" onclick="window.location.href='/investment'">
          <div class="quick-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></div>
          <div class="quick-label">Investments</div>
        </div>
      </div>
    </section>

    <div id="app-footer"></div>
  </div>

  <div id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    // Dashboard Logic
    (async function() {
      const session = await AradelAuth.requireAuth();
      if (!session) return;

      const uid = session.user.id;
      
      // Fetch Wallet
      const { data: wallet } = await window.sb.from('wallets').select('*').eq('user_id', uid).single();
      if (wallet) {
        document.getElementById('walletBalance').textContent = '₦' + Number(wallet.balance).toLocaleString();
        document.getElementById('statDeposit').textContent = '₦' + Number(wallet.total_deposit).toLocaleString();
        document.getElementById('statProfit').textContent = '₦' + Number(wallet.total_profit).toLocaleString();
      }

      // Fetch User Profile for Name & VIP
      const { data: profile } = await window.sb.from('users').select('full_name, vip_level').eq('id', uid).single();
      if (profile) {
        document.getElementById('userName').textContent = profile.full_name.split(' ')[0];
        document.getElementById('vipBadge').textContent = profile.vip_level > 0 ? `VIP ${profile.vip_level}` : 'Member';
      }
    })();
  </script>
</body>
</html>
