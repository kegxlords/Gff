<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033A0" />
  <title>Investment Packages - Green Farm Fortune</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    :root {
      --pf-card: rgba(255, 255, 255, 0.72);
      --pf-line: rgba(0, 51, 160, 0.07);
      --pf-txt: #0E1B33;
      --pf-mut: #7A8699;
    }
    * { -webkit-tap-highlight-color: transparent; }
    body {
      background: linear-gradient(180deg, #FFFBF0 0%, #FFF5E0 100%);
      background-attachment: fixed;
      font-family: 'Inter', sans-serif; color: var(--pf-txt);
      margin: 0; padding-bottom: calc(96px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    .vip-wrap { max-width: 520px; margin: 0 auto; padding: 20px; }

    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .12s; }

    /* Section head */
    .sec-head { display: flex; align-items: center; gap: 10px; margin: 4px 0 16px; }
    .sec-head svg { width: 22px; height: 22px; stroke: var(--gff-blue); stroke-width: 2; fill: none; }
    .sec-head h2 { font-size: 19px; font-weight: 800; margin: 0; color: var(--pf-txt); letter-spacing: -0.3px; }
    .sec-head .bal-chip {
      margin-left: auto;
      background: var(--pf-card); border: 1px solid var(--pf-line);
      padding: 6px 12px; border-radius: 16px;
      font-size: 11px; font-weight: 700; color: var(--pf-mut);
    }
    .sec-head .bal-chip strong { color: var(--gff-blue); font-weight: 800; }

    /* ============ PRODUCT CARD (sample layout) ============ */
    .pkg-card {
      background: var(--pf-card);
      border: 1px solid var(--pf-line);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(0, 51, 160, 0.06);
      transition: transform .18s ease;
    }
    .pkg-card:active { transform: scale(0.985); }

    .pkg-main { display: flex; gap: 14px; }

    /* Sector image tile */
    .pkg-img {
      width: 132px; height: 132px; border-radius: 16px;
      flex-shrink: 0; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 54px;
      box-shadow: inset 0 -20px 30px rgba(0,0,0,0.12);
    }
    .pkg-img::after {
      content: ''; position: absolute; top: -30px; right: -30px;
      width: 90px; height: 90px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.35), transparent 70%);
    }
    .sector-crop      { background: linear-gradient(135deg, #228B22, #32CD32); }
    .sector-livestock { background: linear-gradient(135deg, #B8860B, #FFD700); }
    .sector-poultry   { background: linear-gradient(135deg, #B01030, #DC143C); }
    .sector-greenhouse{ background: linear-gradient(135deg, #002171, #0033A0); }
    .sector-all       { background: linear-gradient(135deg, #0033A0 40%, #D4AF37); }

    .pkg-info { flex: 1; min-width: 0; }
    .pkg-name { font-weight: 800; font-size: 15.5px; color: var(--pf-txt); margin-bottom: 8px; letter-spacing: -0.2px; }
    .pkg-quota {
      display: inline-block;
      background: linear-gradient(135deg, var(--gff-blue), var(--gff-blue-dark));
      color: #fff; padding: 4px 12px; border-radius: 10px;
      font-size: 10.5px; font-weight: 800; margin-bottom: 10px;
      box-shadow: 0 4px 10px rgba(0, 51, 160, 0.25);
    }
    .pkg-quota.full { background: linear-gradient(135deg, var(--gff-green), #1B6E1B); }
    .pkg-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12.5px; color: var(--pf-mut); font-weight: 600; margin-bottom: 6px;
    }
    .pkg-row b { font-weight: 800; font-size: 12.5px; }
    .pkg-row b.pct   { color: var(--gff-green); }
    .pkg-row b.green { color: var(--gff-green); }
    .pkg-row b.gold  { color: var(--gff-gold-dark); }
    .pkg-bar {
      height: 7px; background: rgba(0, 51, 160, 0.08);
      border-radius: 4px; overflow: hidden; margin-bottom: 10px;
    }
    .pkg-bar i {
      display: block; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--gff-green), var(--gff-green-light));
      transition: width .8s cubic-bezier(.22,1,.36,1);
    }

    /* Card footer: price + button */
    .pkg-foot {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(0, 51, 160, 0.07);
      margin-top: 14px; padding-top: 14px;
    }
    .pkg-price {
      font-family: 'Fraunces', serif;
      font-size: 22px; font-weight: 800; color: var(--gff-blue-dark); letter-spacing: -0.5px;
    }
    .pkg-price small { font-size: 11px; font-family: 'Inter', sans-serif; color: var(--pf-mut); font-weight: 700; margin-left: 4px; }
    .pkg-btn {
      padding: 13px 24px; border-radius: 14px; border: none;
      font-weight: 800; font-size: 13.5px; font-family: inherit; cursor: pointer;
      transition: transform .18s ease;
    }
    .pkg-btn:active { transform: scale(0.96); }
    .pkg-btn.buy {
      background: linear-gradient(135deg, var(--gff-blue), var(--gff-blue-dark));
      color: #fff; box-shadow: 0 8px 18px rgba(0, 51, 160, 0.28);
    }
    .pkg-btn.active-plan {
      background: rgba(34, 139, 34, 0.10); color: var(--gff-green);
      border: 1px solid rgba(34, 139, 34, 0.25);
    }
    .pkg-btn.locked { background: rgba(0, 51, 160, 0.06); color: var(--pf-mut); cursor: not-allowed; }

    /* ============ BOTTOM SHEET ============ */
    .sheet-overlay {
      position: fixed; inset: 0; background: rgba(14, 27, 51, 0.45);
      backdrop-filter: blur(4px); z-index: 900;
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    .sheet-overlay.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: absolute; bottom: 0; left: 50%; transform: translate(-50%, 100%);
      width: 100%; max-width: 520px;
      background: #fff; border-radius: 28px 28px 0 0;
      padding: 14px 22px calc(28px + env(safe-area-inset-bottom));
      transition: transform .35s cubic-bezier(.22,1,.36,1);
    }
    .sheet-overlay.show .sheet { transform: translate(-50%, 0); }
    .sheet-handle { width: 44px; height: 4px; border-radius: 2px; background: #E5E7EB; margin: 0 auto 18px; }
    .sheet-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 800; color: var(--gff-blue-dark); margin-bottom: 4px; }
    .sheet-sub { font-size: 12px; color: var(--pf-mut); margin-bottom: 16px; }
    .sheet-row { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #F3F4F6; font-size: 13.5px; }
    .sheet-row span { color: var(--pf-mut); font-weight: 500; }
    .sheet-row strong { font-weight: 800; color: var(--pf-txt); }
    .sheet-row strong.green { color: var(--gff-green); }
    .sheet-note {
      margin: 14px 0 18px; font-size: 11.5px; color: var(--pf-mut);
      background: rgba(34, 139, 34, 0.06); border: 1px solid rgba(34, 139, 34, 0.15);
      padding: 10px 14px; border-radius: 12px; line-height: 1.5;
    }
    .sheet-actions { display: flex; gap: 10px; }
    .sheet-cancel {
      flex: 1; padding: 14px; border-radius: 14px; border: 1px solid var(--pf-line);
      background: #F9FAFB; color: var(--pf-mut); font-weight: 700; font-family: inherit; font-size: 14px; cursor: pointer;
    }
    .sheet-confirm {
      flex: 2; padding: 14px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, var(--gff-blue), var(--gff-blue-dark));
      color: #fff; font-weight: 800; font-family: inherit; font-size: 14px; cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 51, 160, 0.3);
    }
    .sheet-confirm:disabled { opacity: .6; cursor: not-allowed; }

    #toast {
      position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
      background: var(--gff-blue-dark); color: #fff; padding: 12px 24px;
      border-radius: 25px; font-size: 13px; font-weight: 700; z-index: 1000;
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <div class="vip-wrap">
    <div class="sec-head rise d1">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <h2>Investment Packages</h2>
      <div class="bal-chip">Bal: <strong id="vipBalance">0 CFA</strong></div>
    </div>

    <div id="pkgList" class="rise d2"></div>
  </div>

  <!-- Purchase Bottom Sheet -->
  <div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="sheetTitle">VIP 1</div>
      <div class="sheet-sub" id="sheetSector">Crop Farming</div>
      <div class="sheet-row"><span>Investment Amount</span><strong id="sheetAmount">—</strong></div>
      <div class="sheet-row"><span>Daily Income</span><strong class="green" id="sheetDaily">—</strong></div>
      <div class="sheet-row"><span>Duration</span><strong id="sheetDuration">30 Days</strong></div>
      <div class="sheet-row"><span>Total Return</span><strong id="sheetTotal">—</strong></div>
      <div class="sheet-note">💡 Daily income is credited to your wallet automatically every night. Your VIP level upgrades instantly upon purchase.</div>
      <div class="sheet-actions">
        <button class="sheet-cancel" onclick="closeSheet()">Cancel</button>
        <button class="sheet-confirm" id="sheetConfirm">Confirm Investment</button>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let PRODUCTS = [], BALANCE = 0, ACTIVE_COUNT = {}, SELECTED = null;

    const EMOJI = {
      'Crop Farming': '🌾', 'Livestock Farming': '🐄', 'Poultry Farming': '🐔',
      'Greenhouse & Horticulture': '🏡', 'All Sectors': '🌍'
    };
    const SCLASS = {
      'Crop Farming': 'sector-crop', 'Livestock Farming': 'sector-livestock',
      'Poultry Farming': 'sector-poultry', 'Greenhouse & Horticulture': 'sector-greenhouse',
      'All Sectors': 'sector-all'
    };
    const fmt = n => Number(n).toLocaleString();

    function render() {
      const list = document.getElementById('pkgList');

      list.innerHTML = PRODUCTS.map(p => {
        const total = p.daily_income * p.duration_days;
        const roi = Math.round((total / p.amount) * 100);
        const barWidth = Math.min(100, Math.round(roi / 10));
        const count = ACTIVE_COUNT[p.id] || 0;
        const quotaFull = count >= 3;
        const canAfford = BALANCE >= p.amount;

        let btn;
        if (quotaFull) {
          btn = `<button class="pkg-btn active-plan" onclick="window.location.href='/investment'">View Farms</button>`;
        } else if (!canAfford) {
          btn = `<button class="pkg-btn locked" onclick="window.location.href='/recharge'">Deposit First</button>`;
        } else {
          btn = `<button class="pkg-btn buy" onclick="openSheet('${p.id}')">Invest Now</button>`;
        }

        return `
          <div class="pkg-card">
            <div class="pkg-main">
              <div class="pkg-img ${SCLASS[p.sector] || 'sector-crop'}">${EMOJI[p.sector] || '🌱'}</div>
              <div class="pkg-info">
                <div class="pkg-name">${p.name} — ${p.sector}</div>
                <span class="pkg-quota ${quotaFull ? 'full' : ''}">Quota ${count}/3</span>
                <div class="pkg-row"><span>ROI Progress</span><b class="pct">${roi}%</b></div>
                <div class="pkg-bar"><i style="width: ${barWidth}%"></i></div>
                <div class="pkg-row"><span>Daily Income</span><b class="green">${fmt(p.daily_income)} CFA</b></div>
                <div class="pkg-row"><span>Total Income</span><b class="gold">${fmt(total)} CFA</b></div>
              </div>
            </div>
            <div class="pkg-foot">
              <div class="pkg-price">${fmt(p.amount)}<small>CFA</small></div>
              ${btn}
            </div>
          </div>`;
      }).join('');
    }

    function openSheet(id) {
      SELECTED = PRODUCTS.find(p => p.id === id);
      if (!SELECTED) return;
      const count = ACTIVE_COUNT[SELECTED.id] || 0;
      document.getElementById('sheetTitle').textContent = SELECTED.name;
      document.getElementById('sheetSector').textContent = (EMOJI[SELECTED.sector] || '🌱') + ' ' + SELECTED.sector + ' • Quota ' + count + '/3';
      document.getElementById('sheetAmount').textContent = fmt(SELECTED.amount) + ' CFA';
      document.getElementById('sheetDaily').textContent = fmt(SELECTED.daily_income) + ' CFA / day';
      document.getElementById('sheetDuration').textContent = SELECTED.duration_days + ' Days';
      document.getElementById('sheetTotal').textContent = fmt(SELECTED.daily_income * SELECTED.duration_days) + ' CFA';
      document.getElementById('sheetOverlay').classList.add('show');
    }
    function closeSheet() { document.getElementById('sheetOverlay').classList.remove('show'); }

    document.getElementById('sheetConfirm').addEventListener('click', async function () {
      if (!SELECTED) return;
      const btn = this;
      btn.disabled = true; btn.textContent = 'Planting...';
      try {
        const session = await AradelAuth.getSession();
        const { data, error } = await window.sb.rpc('purchase_product', {
          p_user_id: session.user.id,
          p_product_id: SELECTED.id
        });
        if (error) throw new Error(error.message);
        if (!data?.ok) throw new Error(data?.error || 'Purchase failed');
        closeSheet();
        AradelAuth.toast('🌱 Investment successful!');
        setTimeout(() => window.location.href = '/investment', 1200);
      } catch (e) {
        AradelAuth.toast(e.message, 'error');
        btn.disabled = false; btn.textContent = 'Confirm Investment';
      }
    });

    document.addEventListener('DOMContentLoaded', async function () {
      const session = await AradelAuth.getSession();
      if (!session) { window.location.href = '/'; return; }
      const uid = session.user.id;

      const { data: wallet } = await window.sb.from('wallets').select('balance').eq('user_id', uid).single();
      BALANCE = wallet ? Number(wallet.balance) : 0;
      document.getElementById('vipBalance').textContent = fmt(BALANCE) + ' CFA';

      const { data: prods } = await window.sb.from('products').select('*').eq('is_active', true).order('amount', { ascending: true });
      PRODUCTS = prods || [];

      // Count active plans per package (quota x/3)
      const { data: owned } = await window.sb.from('user_products').select('product_id').eq('user_id', uid).eq('status', 'active');
      ACTIVE_COUNT = {};
      (owned || []).forEach(o => { ACTIVE_COUNT[o.product_id] = (ACTIVE_COUNT[o.product_id] || 0) + 1; });

      render();
    });
  </script>
</body>
</html>
