<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033A0" />
  <title>My Team - Green Farm Fortune</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    :root { --pf-card: rgba(255,255,255,0.72); --pf-line: rgba(0,51,160,0.07); --pf-txt: #0E1B33; --pf-mut: #7A8699; }
    * { -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(180deg,#FFFBF0 0%,#FFF5E0 100%); background-attachment: fixed; font-family:'Inter',sans-serif; color:var(--pf-txt); margin:0; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .tm-wrap { max-width: 520px; margin: 0 auto; padding: 20px; }
    @keyframes rise { from { opacity:0; transform:translateY(16px);} to { opacity:1; transform:none;} }
    .rise { opacity:0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
    .d1{animation-delay:.05s;} .d2{animation-delay:.12s;}
    .tm-strip { background: linear-gradient(135deg,var(--gff-blue),var(--gff-blue-dark)); border-radius:20px; padding:18px; color:#fff; display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center; margin-bottom:18px; box-shadow:0 10px 26px rgba(0,51,160,.25); }
    .tm-strip b { display:block; font-family:'Fraunces',serif; font-size:17px; font-weight:800; }
    .tm-strip b.gold { color:var(--gff-gold); }
    .tm-strip span { font-size:9.5px; letter-spacing:.8px; text-transform:uppercase; opacity:.75; font-weight:700; }
    .sec-title { font-size:15px; font-weight:800; margin:0 0 12px; }
    .tm-card { background:var(--pf-card); border:1px solid var(--pf-line); border-radius:18px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:12px; backdrop-filter:blur(10px); }
    .tm-av { width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,var(--gff-green),var(--gff-green-light)); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
    .tm-mid { flex:1; min-width:0; }
    .tm-name { font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tm-sub { font-size:11px; color:var(--pf-mut); margin-top:2px; }
    .tm-right { text-align:right; }
    .tm-comm { font-weight:800; font-size:13px; color:var(--gff-gold-dark); }
    .tm-st { font-size:9.5px; font-weight:800; padding:3px 8px; border-radius:8px; display:inline-block; margin-top:4px; }
    .tm-st.active { background:rgba(34,139,34,.1); color:var(--gff-green); }
    .tm-st.idle { background:rgba(0,51,160,.06); color:var(--pf-mut); }
    .tm-empty { text-align:center; padding:36px 20px; background:var(--pf-card); border:2px dashed rgba(0,51,160,.12); border-radius:20px; color:var(--pf-mut); font-size:14px; }
    .tm-empty button { margin-top:14px; background:linear-gradient(135deg,var(--gff-gold),var(--gff-gold-dark)); color:var(--gff-blue-dark); border:none; padding:12px 24px; border-radius:14px; font-weight:800; font-family:inherit; cursor:pointer; }
    #toast { position:fixed; bottom:110px; left:50%; transform:translateX(-50%); background:var(--gff-blue-dark); color:#fff; padding:12px 24px; border-radius:25px; font-size:13px; font-weight:700; z-index:1000; opacity:0; pointer-events:none; transition:opacity .3s; }
    #toast.show { opacity:1; }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <div class="tm-wrap">
    <div class="tm-strip rise d1">
      <div><b id="tmTotal">0</b><span>Members</span></div>
      <div><b id="tmActive">0</b><span>Active</span></div>
      <div><b class="gold" id="tmEarn">0 CFA</b><span>Earned</span></div>
    </div>
    <h3 class="sec-title rise d2">My Downline</h3>
    <div id="tmList" class="rise d2"></div>
  </div>
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const fmt = n => Number(n).toLocaleString() + ' CFA';

    document.addEventListener('DOMContentLoaded', async function () {
      const session = await AradelAuth.getSession();
      if (!session) { window.location.href = '/'; return; }

      const { data: team, error } = await window.sb.rpc('get_team', { p_uid: session.user.id });
      const list = document.getElementById('tmList');

      if (error || !team || team.error) {
        list.innerHTML = '<div class="tm-empty">Failed to load team data.<br>Please try again.</div>';
        return;
      }

      document.getElementById('tmTotal').textContent = team.total_downlines;
      document.getElementById('tmActive').textContent = team.active_downlines;
      document.getElementById('tmEarn').textContent = fmt(team.referral_earnings);

      if (!team.members || !team.members.length) {
        list.innerHTML = `
          <div class="tm-empty">No team members yet.<br>Share your referral code to start earning 22%!
            <br><button onclick="window.location.href='/refer'">Invite Friends</button>
          </div>`;
        return;
      }

      list.innerHTML = team.members.map(r => `
        <div class="tm-card">
          <div class="tm-av">${r.full_name.charAt(0).toUpperCase()}</div>
          <div class="tm-mid">
            <div class="tm-name">${r.full_name}</div>
            <div class="tm-sub">Joined ${new Date(r.created_at).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })} • Dep ${fmt(r.total_deposit)} • Inv ${fmt(r.invested)}${r.vip_level ? ' • VIP ' + r.vip_level : ''}</div>
            </div>
          <div class="tm-right">
            <div class="tm-comm">+${fmt(r.commission)}</div>
            <span class="tm-st ${r.active_plans > 0 ? 'active' : 'idle'}">${r.active_plans > 0 ? 'ACTIVE' : 'NOT INVESTED'}</span>
          </div>
        </div>`).join('');
    });
  </script>
</body>
</html>
