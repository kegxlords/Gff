<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033A0" />
  <title>Deposit - Green Farm Fortune</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    :root { --pf-card: rgba(255,255,255,0.72); --pf-line: rgba(0,51,160,0.07); --pf-txt: #0E1B33; --pf-mut: #7A8699; }
    * { -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(180deg,#FFFBF0 0%,#FFF5E0 100%); background-attachment: fixed; font-family:'Inter',sans-serif; color:var(--pf-txt); margin:0; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .rc-wrap { max-width: 520px; margin: 0 auto; padding: 20px; }
    @keyframes rise { from { opacity:0; transform:translateY(16px);} to { opacity:1; transform:none;} }
    .rise { opacity:0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
    .d1{animation-delay:.05s;} .d2{animation-delay:.12s;} .d3{animation-delay:.19s;}
    .gw-note { background:rgba(34,139,34,.06); border:1px solid rgba(34,139,34,.15); border-radius:14px; padding:12px 14px; font-size:11.5px; color:#1B6E1B; line-height:1.6; margin-bottom:16px; }
    .form-card { background:var(--pf-card); border:1px solid var(--pf-line); border-radius:20px; padding:18px; margin-bottom:16px; backdrop-filter:blur(10px); }
    .f-lbl { font-size:11px; font-weight:700; color:var(--pf-mut); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; display:block; }
    .f-inp { width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--pf-line); background:#fff; font-family:inherit; font-size:14px; margin-bottom:14px; color:var(--pf-txt); }
    .f-inp:focus { outline:none; border-color:var(--gff-blue); }
    .f-row { display:flex; gap:10px; } .f-row > * { flex:1; }
    .f-save { width:100%; padding:14px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--gff-blue),var(--gff-blue-dark)); color:#fff; font-weight:800; font-family:inherit; font-size:14px; cursor:pointer; box-shadow:0 8px 18px rgba(0,51,160,.3); }
    .f-save:disabled { opacity:.6; cursor:not-allowed; }
    .sec-title { font-size:15px; font-weight:800; margin:0 0 12px; }
    .dep-row { background:var(--pf-card); border:1px solid var(--pf-line); border-radius:16px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
    .dep-amt { font-weight:800; font-size:15px; }
    .dep-sub { font-size:11px; color:var(--pf-mut); margin-top:3px; }
    .st { padding:4px 10px; border-radius:10px; font-size:10px; font-weight:800; }
    .st.pending,.st.processing { background:#FFF8E1; color:#B8860B; }
    .st.approved,.st.paid,.st.successful { background:rgba(34,139,34,.1); color:var(--gff-green); }
    .st.rejected,.st.failed { background:rgba(220,20,60,.08); color:var(--gff-red); }
    .st.refunded { background:rgba(0,51,160,.08); color:var(--gff-blue); }
    #toast { position:fixed; bottom:110px; left:50%; transform:translateX(-50%); background:var(--gff-blue-dark); color:#fff; padding:12px 24px; border-radius:25px; font-size:13px; font-weight:700; z-index:1000; opacity:0; pointer-events:none; transition:opacity .3s; }
    #toast.show { opacity:1; }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <div class="rc-wrap">
    <div id="autoPane">
      <div class="gw-note rise d1">⚡ Pay with MTN MoMo / Orange Money. Your wallet credits <b>automatically</b> the moment payment confirms — no admin wait.</div>
      <div class="form-card rise d2">
        <label class="f-lbl">Amount (CFA) — min 500</label>
        <input class="f-inp" id="autoAmount" type="number" min="500" placeholder="e.g. 10000" inputmode="numeric" />
        <div class="f-row">
          <div>
            <label class="f-lbl">Country</label>
            <select class="f-inp" id="autoCountry" onchange="updatePhoneHint()">
              <option value="CM">🇨 Cameroon</option>
              <option value="CI">🇨🇮 Côte d'Ivoire</option>
              <option value="SN">🇸🇳 Senegal</option>
              <option value="NG">🇳 Nigeria</option>
              <option value="GH">🇬🇭 Ghana</option>
            </select>
          </div>
          <div>
            <label class="f-lbl">Mobile Number</label>
            <input class="f-inp" id="autoPhone" placeholder="237XXXXXXXXX" inputmode="tel" />
          </div>
        </div>
        <div id="opWrapAuto">
          <label class="f-lbl">Network / Operator</label>
          <select class="f-inp" id="autoOperator">
            <option value="mtn">MTN Mobile Money</option>
            <option value="orange">Orange Money</option>
          </select>
        </div>
        <button class="f-save" id="autoBtn" onclick="payNow()">Pay with Mobile Money →</button>
      </div>
    </div>
    <h3 class="sec-title rise d3">Recent Gateway Deposits</h3>
    <div id="autoList" class="rise d3"></div>
  </div>
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let UID = null, SESSION = null, SETTINGS = null;
    const fmt = n => Number(n).toLocaleString() + ' CFA';
    const HINTS = { CM: '237XXXXXXXXX', CI: '225XXXXXXXXX', SN: '221XXXXXXXXX', NG: '234XXXXXXXXXX', GH: '233XXXXXXXXX' };

    function updatePhoneHint() {
      const c = document.getElementById('autoCountry').value;
      document.getElementById('autoPhone').placeholder = HINTS[c] || '';
      const ow = document.getElementById('opWrapAuto');
      if (ow) ow.style.display = (c === 'CM') ? '' : 'none';
    }

    // ===== OTPAY DEPOSIT (H5 redirect) =====
    async function payNow() {
      const btn = document.getElementById('autoBtn');
      const amount = Number(document.getElementById('autoAmount').value);
      const country_code = document.getElementById('autoCountry').value;
      const mobile = document.getElementById('autoPhone').value.trim();
      const operator = (document.getElementById('autoOperator') || {}).value || '';
      if (!amount || amount < 500) return AradelAuth.toast('Minimum deposit is 500 CFA', 'error');
      if (!mobile) return AradelAuth.toast('Enter your mobile money number', 'error');

      btn.disabled = true; btn.textContent = 'Creating order...';
      try {
        const res = await fetch('/api/payments/otpay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SESSION.access_token },
          body: JSON.stringify({
            action: 'deposit-create',
            amount,
            currency: SETTINGS?.otpay_currency || 'XAF',
            country_code,
            mobile,
            operator,
            email: SESSION.user.email
          })
        });
        const ct = res.headers.get('content-type') || '';
        if (!ct.includes('application/json')) { console.error(await res.text()); throw new Error('Gateway server error — contact support'); }
        const d = await res.json();
        if (!d.ok) throw new Error(d.error || 'Gateway error');
        sessionStorage.setItem('gff_last_deposit', d.merchantOrderId);
        window.location.href = d.h5Url; // H5 redirect handling
      } catch (e) {
        AradelAuth.toast(e.message, 'error');
        btn.disabled = false; btn.textContent = 'Pay with Mobile Money →';
      }
    }

    async function loadAuto() {
      const { data: txs } = await window.sb.from('payment_transactions')
        .select('*').eq('user_id', UID).eq('kind', 'deposit')
        .order('created_at', { ascending: false }).limit(8);
      const list = document.getElementById('autoList');
      if (!txs || !txs.length) { list.innerHTML = '<div style="text-align:center;color:var(--pf-mut);font-size:13px;padding:14px;">No gateway deposits yet.</div>'; return; }
      list.innerHTML = txs.map(t => `
        <div class="dep-row">
          <div><div class="dep-amt">${fmt(t.amount)}</div><div class="dep-sub">${t.mode.toUpperCase()} • ${t.merchant_order_id}<br>${new Date(t.created_at).toLocaleString()}</div></div>
          <span class="st ${t.status}">${t.status.toUpperCase()}</span>
        </div>`).join('');
    }

    document.addEventListener('DOMContentLoaded', async function () {
      SESSION = await AradelAuth.getSession();
      if (!SESSION) { window.location.href = '/'; return; }
      UID = SESSION.user.id;

      const { data: s } = await window.sb.from('platform_settings').select('*').eq('id', 1).single();
      SETTINGS = s;
      if (s && !s.otpay_enabled) {
        document.getElementById('autoPane').innerHTML = '<div class="gw-note">⚠️ Instant deposits are temporarily disabled by admin. Please contact support.</div>';
      }
      if (s?.otpay_country) { document.getElementById('autoCountry').value = s.otpay_country; }
      updatePhoneHint();

      loadAuto();
    });
  </script>
</body>
</html>
