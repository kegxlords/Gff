<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033A0" />
  <title>Confirming Payment - Green Farm Fortune</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fraunces:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(180deg,#FFFBF0 0%,#FFF5E0 100%); background-attachment: fixed; font-family:'Inter',sans-serif; color:#0E1B33; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .pr-card { max-width:400px; width:100%; background:rgba(255,255,255,.85); border:1px solid rgba(0,51,160,.07); border-radius:26px; padding:34px 26px; text-align:center; backdrop-filter:blur(10px); box-shadow:0 16px 50px rgba(0,51,160,.12); }
    .pr-ico { font-size:52px; margin-bottom:14px; }
    .pr-spin { width:56px; height:56px; margin:0 auto 16px; border-radius:50%; border:5px solid rgba(0,51,160,.15); border-top-color:#0033A0; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .pr-title { font-family:'Fraunces',serif; font-size:21px; font-weight:800; margin-bottom:8px; }
    .pr-sub { font-size:13px; color:#7A8699; line-height:1.6; margin-bottom:22px; }
    .pr-btn { display:block; width:100%; padding:14px; border-radius:14px; border:none; font-weight:800; font-family:inherit; font-size:14px; cursor:pointer; margin-bottom:10px; }
    .pr-btn.blue { background:linear-gradient(135deg,#0033A0,#002171); color:#fff; }
    .pr-btn.ghost { background:#F3F4F6; color:#7A8699; }
  </style>
</head>
<body>
  <div class="pr-card">
    <div id="prState">
      <div class="pr-spin"></div>
      <div class="pr-title">Confirming your payment…</div>
      <div class="pr-sub">We're checking with the payment gateway. This usually takes a few seconds. Please don't close this page.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    const state = document.getElementById('prState');
    const q = new URLSearchParams(location.search);
    let ORDER = q.get('merchantOrderId') || q.get('orderId') || sessionStorage.getItem('gff_last_deposit');

    function show(kind, title, sub) {
      const ico = kind === 'ok' ? '✅' : kind === 'fail' ? '❌' : '⏳';
      state.innerHTML = `
        <div class="pr-ico">${ico}</div>
        <div class="pr-title">${title}</div>
        <div class="pr-sub">${sub}</div>
        <button class="pr-btn blue" onclick="location.href='/dashboard'">Go to Dashboard</button>
        <button class="pr-btn ghost" onclick="location.href='/transaction-history'">View History</button>`;
    }

    async function poll(token, tries = 20) {
      for (let i = 0; i < tries; i++) {
        try {
          const res = await fetch('/api/payments/otpay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ action: 'deposit-query', merchantOrderId: ORDER })
          });
          const d = await res.json();
          if (d.ok) {
            if (d.status === 'paid') return show('ok', 'Payment Successful!', 'Your wallet has been credited. Happy farming! 🌾');
            if (d.status === 'failed') return show('fail', 'Payment Failed', 'The gateway reported this payment as failed. No money was deducted, or it will auto-refund.');
            if (d.status === 'refunded') return show('fail', 'Payment Refunded', 'This payment was refunded by the gateway.');
          }
        } catch (e) { /* keep polling */ }
        await new Promise(r => setTimeout(r, 3000));
      }
      show('wait', 'Still Processing', "Payment not confirmed yet. We'll credit your wallet automatically the moment the gateway confirms — check your history shortly.");
    }

    (async function () {
      const session = await AradelAuth.getSession();
      if (!session) { location.href = '/'; return; }
      if (!ORDER) { show('wait', 'No Order Found', 'We could not find a payment to confirm. Check your transaction history.'); return; }
      poll(session.access_token);
    })();
  </script>
</body>
</html>
