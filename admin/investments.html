<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Investments - GFF</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fraunces:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body>
  <div id="app-header"></div>
  <div class="adm-wrap">
    <nav class="adm-nav">
      <a class="adm-chip" href="/admin/dashboard">Overview</a>
      <a class="adm-chip" href="/admin/deposits">Deposits</a>
      <a class="adm-chip" href="/admin/withdrawals">Withdrawals</a>
      <a class="adm-chip" href="/admin/users">Users</a>
      <a class="adm-chip on" href="/admin/investments">Investments</a>
      <a class="adm-chip" href="/admin/messages">Messages</a>
      <a class="adm-chip" href="/admin/settings">Settings</a>
    </nav>

    <h2 class="adm-title">All Investments</h2>
    <div class="adm-tabs">
      <div class="adm-tab on" data-t="active">Active</div>
      <div class="adm-tab" data-t="completed">Completed</div>
    </div>
    <div id="list"></div>
  </div>
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let SESSION = null, TAB = 'active';
    const fmt = n => Number(n).toLocaleString() + ' CFA';

    async function adminGuard() {
      const s = await AradelAuth.getSession();
      if (!s) { location.href = '/'; return null; }
      const { data: p } = await window.sb.from('users').select('is_admin').eq('id', s.user.id).single();
      if (!p || !p.is_admin) { location.href = '/dashboard'; return null; }
      return s;
    }

    async function complete(id) {
      if (!confirm('Mark this plan as completed? Daily income will stop.')) return;
      await window.sb.from('user_products').update({ status: 'completed' }).eq('id', id);
      AradelAuth.toast('Plan completed');
      load();
    }

    async function remove(id) {
      if (!confirm('DELETE this investment record? No refund is issued. This cannot be undone.')) return;
      await window.sb.from('user_products').delete().eq('id', id);
      AradelAuth.toast('Investment deleted');
      load();
    }

    async function load() {
      const { data: plans } = await window.sb.from('user_products')
        .select('*, users(full_name), products(name, duration_days)')
        .eq('status', TAB).order('start_date', { ascending: false }).limit(100);

      const list = document.getElementById('list');
      if (!plans || !plans.length) { list.innerHTML = '<div class="adm-empty">No ' + TAB + ' investments.</div>'; return; }

      list.innerHTML = plans.map(p => `
        <div class="adm-card">
          <div class="adm-row-top">
            <div>
              <div class="adm-name">${p.users?.full_name || 'User'} — ${p.products?.name || 'Plan'}</div>
              <div class="adm-sub">${p.products?.sector || ''}<br>${p.days_collected || 0}/${p.products?.duration_days || 30} days • +${fmt(p.daily_income)}/day<br>Started ${new Date(p.start_date).toLocaleDateString()}</div>
            </div>
            <div style="text-align:right;">
              <div class="adm-amt gold">${fmt(p.amount)}</div>
              <span class="adm-st ${p.status}">${p.status.toUpperCase()}</span>
            </div>
          </div>
          ${TAB === 'active' ? `
          <div class="adm-actions">
            <button class="adm-btn ok" onclick="complete('${p.id}')">✓ Complete</button>
            <button class="adm-btn no" onclick="remove('${p.id}')">🗑 Delete</button>
          </div>` : ''}
        </div>`).join('');
    }

    document.querySelector('.adm-tabs').addEventListener('click', e => {
      const t = e.target.closest('.adm-tab');
      if (!t) return;
      document.querySelector('.adm-tab.on').classList.remove('on');
      t.classList.add('on');
      TAB = t.dataset.t;
      load();
    });

    document.addEventListener('DOMContentLoaded', async function () {
      SESSION = await adminGuard();
      if (!SESSION) return;
      load();
    });
  </script>
</body>
</html>
