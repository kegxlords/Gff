<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Deposits - GFF</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fraunces:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body>
  <div id="app-header"></div>
  <div class="adm-wrap">
    <nav class="adm-nav">
      <a class="adm-chip" href="/admin/dashboard">Overview</a>
      <a class="adm-chip on" href="/admin/deposits">Deposits</a>
      <a class="adm-chip" href="/admin/withdrawals">Withdrawals</a>
      <a class="adm-chip" href="/admin/users">Users</a>
      <a class="adm-chip" href="/admin/investments">Investments</a>
      <a class="adm-chip" href="/admin/messages">Messages</a>
      <a class="adm-chip" href="/admin/settings">Settings</a>
    </nav>

    <h2 class="adm-title">Deposits</h2>

    <div class="adm-stats">
      <div class="adm-stat"><b id="cPending">0</b><span>Pending</span></div>
      <div class="adm-stat"><b id="cPaid">0</b><span>Paid</span></div>
      <div class="adm-stat"><b id="cFailed">0</b><span>Failed</span></div>
    </div>

    <div class="adm-tabs">
      <div class="adm-tab on" data-t="pending">Pending</div>
      <div class="adm-tab" data-t="paid">Paid</div>
      <div class="adm-tab" data-t="failed">Failed</div>
      <div class="adm-tab" data-t="refunded">Refunded</div>
    </div>
    <div id="list"></div>
  </div>
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let SESSION = null, TAB = 'pending';
    const fmt = n => Number(n).toLocaleString() + ' CFA';

    async function adminGuard() {
      const s = await AradelAuth.getSession();
      if (!s) { location.href = '/'; return null; }
      const { data: p } = await window.sb.from('users').select('is_admin').eq('id', s.user.id).single();
      if (!p || !p.is_admin) { location.href = '/dashboard'; return null; }
      return s;
    }

    async function act(merchantOrderId, action) {
      const msgs = {
        'admin-deposit-verify': 'Query gateway and auto-credit if paid?',
        'admin-deposit-credit': 'FORCE CREDIT without gateway confirmation? (use only if gateway callback failed but payment was received)',
        'admin-deposit-fail': 'Mark this deposit as FAILED?'
      };
      if (!confirm(msgs[action])) return;

      const res = await fetch('/api/payments/otpay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SESSION.access_token },
        body: JSON.stringify({ action, merchantOrderId })
      });
      const d = await res.json();
      AradelAuth.toast(d.message || (d.ok ? 'Done' : d.error), d.ok ? 'success' : 'error');
      if (d.ok) load();
    }

    async function load() {
      // Counts
      const { count: cp } = await window.sb.from('payment_transactions').select('id', { count: 'exact', head: true }).eq('kind', 'deposit').eq('status', 'pending');
      const { count: cpa } = await window.sb.from('payment_transactions').select('id', { count: 'exact', head: true }).eq('kind', 'deposit').eq('status', 'paid');
      const { count: cf } = await window.sb.from('payment_transactions').select('id', { count: 'exact', head: true }).eq('kind', 'deposit').eq('status', 'failed');
      document.getElementById('cPending').textContent = cp || 0;
      document.getElementById('cPaid').textContent = cpa || 0;
      document.getElementById('cFailed').textContent = cf || 0;

      // Transactions
      const { data: txs } = await window.sb.from('payment_transactions')
        .select('*, users(full_name, email)')
        .eq('kind', 'deposit')
        .eq('status', TAB)
        .order('created_at', { ascending: false })
        .limit(50);

      const list = document.getElementById('list');
      if (!txs || !txs.length) {
        list.innerHTML = '<div class="adm-empty">No ' + TAB + ' deposits.</div>';
        return;
      }

      list.innerHTML = txs.map(tx => `
        <div class="adm-card">
          <div class="adm-row-top">
            <div>
              <div class="adm-name">${tx.users?.full_name || 'User'}</div>
              <div class="adm-sub">${tx.users?.email || ''}<br>
                ${tx.mode?.toUpperCase() || 'OTPay'} • ${tx.country_code || ''} ${tx.phone || ''}<br>
                Order: ${tx.merchant_order_id}<br>
                ${new Date(tx.created_at).toLocaleString()}</div>
            </div>
            <div style="text-align:right;">
              <div class="adm-amt green">${fmt(tx.amount)}</div>
              <span class="adm-st ${tx.status}">${tx.status.toUpperCase()}</span>
            </div>
          </div>
          ${TAB === 'pending' ? `
          <div class="adm-actions">
            <button class="adm-btn ok" onclick="act('${tx.merchant_order_id}','admin-deposit-verify')">🔄 Verify & Credit</button>
            <button class="adm-btn plain" onclick="act('${tx.merchant_order_id}','admin-deposit-credit')">💰 Force Credit</button>
            <button class="adm-btn no" onclick="act('${tx.merchant_order_id}','admin-deposit-fail')">✕ Mark Failed</button>
          </div>` : ''}
        </div>`).join('');
    }

    document.querySelector('.adm-tabs').addEventListener('click', e => {
      const t = e.target.closest('.adm-tab');
      if (!t) return;
      document.querySelector('.adm-tab.on').classList.remove('on');
      t.classList.add('on');
      TAB = t.dataset.t;
      load();
    });

    document.addEventListener('DOMContentLoaded', async function () {
      SESSION = await adminGuard();
      if (!SESSION) return;
      load();
    });
  </script>
</body>
</html>
