<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Withdrawals - GFF</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Fraunces:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body>
  <div id="app-header"></div>
  <div class="adm-wrap">
    <nav class="adm-nav">
      <a class="adm-chip" href="/admin/dashboard">Overview</a>
      <a class="adm-chip" href="/admin/deposits">Deposits</a>
      <a class="adm-chip on" href="/admin/withdrawals">Withdrawals</a>
      <a class="adm-chip" href="/admin/users">Users</a>
      <a class="adm-chip" href="/admin/investments">Investments</a>
      <a class="adm-chip" href="/admin/messages">Messages</a>
      <a class="adm-chip" href="/admin/payments">Gateway</a>
      <a class="adm-chip" href="/admin/settings">Settings</a>
    </nav>

    <h2 class="adm-title">Withdrawal Requests</h2>

    <div class="adm-stats">
      <div class="adm-stat"><b id="cPending">0</b><span>Pending</span></div>
      <div class="adm-stat"><b id="cApproved">0</b><span>Approved/Sent</span></div>
      <div class="adm-stat"><b id="cRejected">0</b><span>Rejected</span></div>
    </div>

    <div class="adm-tabs">
      <div class="adm-tab on" data-t="pending">Pending</div>
      <div class="adm-tab" data-t="approved">Approved</div>
      <div class="adm-tab" data-t="rejected">Rejected</div>
    </div>
    <div id="list"></div>
  </div>
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let SESSION = null, TAB = 'pending';
    const fmt = n => Number(n).toLocaleString() + ' CFA';

    const GW_CLASS = {
      pending: 'pending', processing: 'pending',
      successful: 'approved', paid: 'approved',
      failed: 'rejected', refunded: 'rejected'
    };

    async function adminGuard() {
      const s = await AradelAuth.getSession();
      if (!s) { location.href = '/'; return null; }
      const { data: p } = await window.sb.from('users').select('is_admin').eq('id', s.user.id).single();
      if (!p || !p.is_admin) { location.href = '/dashboard'; return null; }
      return s;
    }

    async function act(id, action) {
      if (!confirm(`${action === 'approve' ? 'Approve and send this payout to OTPay NOW?' : 'Reject and refund the user?'}`)) return;
      const res = await fetch('/api/withdraw/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SESSION.access_token },
        body: JSON.stringify({ action, request_id: id })
      });
      const d = await res.json();
      AradelAuth.toast(d.ok ? (d.message || 'Withdrawal ' + action + 'd') : d.error, d.ok ? 'success' : 'error');
      if (d.ok) load();
    }

    async function load() {
      // Counts
      const { count: cp } = await window.sb.from('withdrawal_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending');
      const { count: ca } = await window.sb.from('withdrawal_requests').select('id', { count: 'exact', head: true }).eq('status', 'approved');
      const { count: cr } = await window.sb.from('withdrawal_requests').select('id', { count: 'exact', head: true }).eq('status', 'rejected');
      document.getElementById('cPending').textContent = cp || 0;
      document.getElementById('cApproved').textContent = ca || 0;
      document.getElementById('cRejected').textContent = cr || 0;

      // Requests for current tab
      const { data: wds } = await window.sb.from('withdrawal_requests')
        .select('*, users(full_name, email), bank_cards(bank_name, account_name, account_number)')
        .eq('status', TAB)
        .order('created_at', { ascending: false })
        .limit(50);

      const list = document.getElementById('list');
      const all = wds || [];
      if (!all.length) {
        list.innerHTML = '<div class="adm-empty">No ' + TAB + ' withdrawals.</div>';
        return;
      }

      // Gateway dispatch status for these requests
      const ids = all.map(w => w.id);
      const { data: gws } = await window.sb.from('payment_transactions')
        .select('linked_request_id, status, merchant_order_id')
        .in('linked_request_id', ids)
        .order('created_at', { ascending: false });
      const gwMap = {};
      (gws || []).forEach(g => { if (!gwMap[g.linked_request_id]) gwMap[g.linked_request_id] = g; });

      list.innerHTML = all.map(w => {
        const gw = gwMap[w.id];
        return `
        <div class="adm-card">
          <div class="adm-row-top">
            <div>
              <div class="adm-name">${w.users?.full_name || 'User'}</div>
              <div class="adm-sub">${w.users?.email || ''}<br>
                💳 ${w.bank_cards?.bank_name || '—'} • ${w.bank_cards?.account_name || ''} • ${w.bank_cards?.account_number || ''}<br>
                ${new Date(w.created_at).toLocaleString()}</div>
            </div>
            <div style="text-align:right;">
              <div class="adm-amt red">${fmt(w.amount)}</div>
              <div class="adm-sub">Fee ${fmt(w.fee_15percent)} • Pay <b style="color:#228B22">${fmt(w.net_amount)}</b></div>
              <span class="adm-st ${w.status}">${w.status.toUpperCase()}</span>
              ${gw ? `<div style="margin-top:6px;"><span class="adm-st ${GW_CLASS[gw.status] || 'pending'}">GW: ${gw.status.toUpperCase()}</span></div>` : ''}
            </div>
          </div>
          ${w.admin_note ? `<div class="adm-sub" style="margin-top:8px;">📝 ${w.admin_note}</div>` : ''}
          ${TAB === 'pending' ? `
          <div class="adm-actions">
            <button class="adm-btn ok" onclick="act('${w.id}','approve')">✓ Approve & Send</button>
            <button class="adm-btn no" onclick="act('${w.id}','reject')">✕ Reject + Refund</button>
          </div>` : ''}
        </div>`;
      }).join('');
    }

    document.querySelector('.adm-tabs').addEventListener('click', e => {
      const t = e.target.closest('.adm-tab');
      if (!t) return;
      document.querySelector('.adm-tab.on').classList.remove('on');
      t.classList.add('on');
      TAB = t.dataset.t;
      load();
    });

    document.addEventListener('DOMContentLoaded', async function () {
      SESSION = await adminGuard();
      if (!SESSION) return;
      load();
    });
  </script>
</body>
</html>
