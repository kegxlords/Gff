<header class="app-header">
  <div class="header-left">
    <div class="greeting-eyebrow" id="greetingTime">Good morning</div>
    <div class="greeting-name">Hello, <span id="userName">User</span></div>
  </div>
  <div class="header-actions">
    <div class="vip-badge" id="vipBadge">Member</div>
    <button class="icon-btn" onclick="window.location.href='/messages'">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notif-dot" id="notifDot" style="display:none;"></span>
    </button>
  </div>
</header>
