<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033A0" />
  <title>Withdraw - Green Farm Fortune</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    :root { --pf-card: rgba(255,255,255,0.72); --pf-line: rgba(0,51,160,0.07); --pf-txt: #0E1B33; --pf-mut: #7A8699; }
    * { -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(180deg,#FFFBF0 0%,#FFF5E0 100%); background-attachment: fixed; font-family:'Inter',sans-serif; color:var(--pf-txt); margin:0; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .wd-wrap { max-width: 520px; margin: 0 auto; padding: 20px; }
    @keyframes rise { from { opacity:0; transform:translateY(16px);} to { opacity:1; transform:none;} }
    .rise { opacity:0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
    .d1{animation-delay:.05s;} .d2{animation-delay:.12s;} .d3{animation-delay:.19s;}
    .bal-strip { background: linear-gradient(135deg,var(--gff-blue),var(--gff-blue-dark)); border-radius:20px; padding:18px 20px; color:#fff; display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; box-shadow:0 10px 26px rgba(0,51,160,.25); }
    .bal-strip span { font-size:12px; opacity:.8; font-weight:600; }
    .bal-strip strong { display:block; font-family:'Fraunces',serif; font-size:24px; font-weight:800; margin-top:2px; }
    .bal-strip .fee-note { text-align:right; font-size:10.5px; opacity:.85; line-height:1.5; font-weight:600; }
    .sched-banner { background:rgba(255,215,0,.1); border:1px solid rgba(212,175,55,.35); color:#8a6d00; border-radius:14px; padding:12px 16px; font-size:12px; font-weight:700; margin-bottom:14px; line-height:1.6; }
    .pend-banner { background:#FFF8E1; border:1px solid rgba(212,175,55,.35); color:#B8860B; border-radius:14px; padding:12px 16px; font-size:12.5px; font-weight:700; margin-bottom:14px; display:none; }
    .form-card { background:var(--pf-card); border:1px solid var(--pf-line); border-radius:20px; padding:18px; margin-bottom:16px; backdrop-filter:blur(10px); }
    .f-lbl { font-size:11px; font-weight:700; color:var(--pf-mut); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; display:block; }
    .f-inp { width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--pf-line); background:#fff; font-family:inherit; font-size:14px; margin-bottom:14px; color:var(--pf-txt); }
    .f-inp:focus { outline:none; border-color:var(--gff-blue); }
    .f-row { display:flex; gap:10px; } .f-row > * { flex:1; }
    .sum-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(0,51,160,.06); font-size:13.5px; }
    .sum-row span { color:var(--pf-mut); font-weight:500; }
    .sum-row strong { font-weight:800; }
    .sum-row strong.green { color:var(--gff-green); } .sum-row strong.red { color:var(--gff-red); }
    .sum-row.last { border-bottom:none; }
    .wd-go { width:100%; padding:15px; border:none; border-radius:16px; background:linear-gradient(135deg,var(--gff-red),#B01030); color:#fff; font-weight:800; font-family:inherit; font-size:15px; cursor:pointer; box-shadow:0 10px 24px rgba(220,20,60,.28); margin-top:8px; }
    .wd-go:disabled { opacity:.5; cursor:not-allowed; }
    .wd-note { font-size:11px; color:var(--pf-mut); text-align:center; margin-top:12px; line-height:1.6; }
    .sec-title { font-size:15px; font-weight:800; margin:0 0 12px; }
    .dep-row { background:var(--pf-card); border:1px solid var(--pf-line); border-radius:16px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
    .dep-amt { font-weight:800; font-size:15px; }
    .dep-sub { font-size:11px; color:var(--pf-mut); margin-top:3px; }
    .st { padding:4px 10px; border-radius:10px; font-size:10px; font-weight:800; }
    .st.pending { background:#FFF8E1; color:#B8860B; }
    .st.approved { background:rgba(34,139,34,.1); color:var(--gff-green); }
    .st.rejected { background:rgba(220,20,60,.08); color:var(--gff-red); }
    #toast { position:fixed; bottom:110px; left:50%; transform:translateX(-50%); background:var(--gff-blue-dark); color:#fff; padding:12px 24px; border-radius:25px; font-size:13px; font-weight:700; z-index:1000; opacity:0; pointer-events:none; transition:opacity .3s; }
    #toast.show { opacity:1; }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <div class="wd-wrap">
    <div class="bal-strip rise d1">
      <div><span>Available Balance</span><strong id="wdBalance">0 CFA</strong></div>
      <div class="fee-note" id="feeNote">15% charge<br>applies per withdrawal</div>
    </div>
    <div class="sched-banner rise d1" id="schedBanner">📅 Loading payout schedule…</div>
    <div class="pend-banner" id="pendBanner">⏳ You have a withdrawal pending. Please wait for the next payout window.</div>

    <div class="form-card rise d2">
      <label class="f-lbl">Amount to Withdraw (CFA) — min 1,000</label>
      <input class="f-inp" id="insAmount" type="number" min="1000" placeholder="e.g. 10000" oninput="insSummary()" />
      <div class="f-row">
        <div>
          <label class="f-lbl">Country</label>
          <select class="f-inp" id="insCountry" onchange="insCountryChanged()">
            <option value="CM">🇨🇲 Cameroon</option>
            <option value="CI">🇨🇮 Côte d'Ivoire</option>
            <option value="SN">🇸🇳 Senegal</option>
          </select>
        </div>
        <div id="opWrap">
          <label class="f-lbl">Operator</label>
          <select class="f-inp" id="insOperator">
            <option value="mtn">MTN MoMo</option>
            <option value="orange">Orange Money</option>
          </select>
        </div>
      </div>
      <label class="f-lbl">Recipient Mobile Number</label>
      <input class="f-inp" id="insPhone" placeholder="237XXXXXXXXX" inputmode="tel" />
      <label class="f-lbl">Recipient Name (must match account)</label>
      <input class="f-inp" id="insName" placeholder="Full name on account" />
      <div class="sum-row"><span>Fee (<span id="insFeePct">15</span>%)</span><strong class="red" id="insFee">—</strong></div>
      <div class="sum-row last"><span>Recipient Receives</span><strong class="green" id="insNet">—</strong></div>
      <button class="wd-go" id="insBtn" onclick="submitWithdrawal()">📤 Submit Withdrawal Request</button>
      <div class="wd-note">Requests are processed manually by admin in the next payout window.</div>
    </div>

    <h3 class="sec-title rise d3">My Withdrawal Requests</h3>
    <div id="insList" class="rise d3"></div>
  </div>
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const HINTS = { CM: '237XXXXXXXXX', CI: '225XXXXXXXXX', SN: '221XXXXXXXXX' };
    let UID = null, SESSION = null, BALANCE = 0, FEE_PCT = 15;
    const fmt = n => Number(n).toLocaleString() + ' CFA';

    function insCountryChanged() {
      const c = document.getElementById('insCountry').value;
      document.getElementById('opWrap').style.display = (c === 'CM') ? '' : 'none';
      document.getElementById('insPhone').placeholder = HINTS[c] || '';
    }
    function insSummary() {
      const amt = Number(document.getElementById('insAmount').value || 0);
      const fee = Math.round(amt * FEE_PCT / 100);
      document.getElementById('insFee').textContent = '− ' + fmt(fee);
      document.getElementById('insNet').textContent = fmt(amt - fee);
    }

    async function submitWithdrawal() {
      const btn = document.getElementById('insBtn');
      const amt = Number(document.getElementById('insAmount').value);
      const country_code = document.getElementById('insCountry').value;
      const mobile = document.getElementById('insPhone').value.trim();
      const name = document.getElementById('insName').value.trim();
      const operator = (document.getElementById('insOperator') || {}).value || '';

      if (!amt || amt < 1000) return AradelAuth.toast('Minimum withdrawal is 1,000 CFA', 'error');
      if (amt > BALANCE) return AradelAuth.toast('Insufficient balance', 'error');
      if (!mobile) return AradelAuth.toast('Enter recipient mobile number', 'error');
      if (!name) return AradelAuth.toast('Enter recipient name', 'error');
      if (!confirm(`Submit withdrawal request for ${fmt(amt)} to ${mobile}?\nIt will be processed in the next payout window.`)) return;

      btn.disabled = true; btn.textContent = 'Submitting...';
      try {
        const r = await fetch('/api/withdraw/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: UID, amount: amt, recipient_name: name, recipient_mobile: mobile, country_code, operator })
        });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error);
        AradelAuth.toast('📤 Queued for next payout window');
        setTimeout(() => location.href = '/transaction-history', 1400);
      } catch (e) {
        AradelAuth.toast(e.message, 'error');
        btn.disabled = false; btn.textContent = '📤 Submit Withdrawal Request';
      }
    }

    async function loadRequests() {
      const { data: txs } = await window.sb.from('withdrawal_requests')
        .select('*').eq('user_id', UID)
        .order('created_at', { ascending: false }).limit(8);
      const list = document.getElementById('insList');
      if (!txs || !txs.length) { list.innerHTML = '<div style="text-align:center;color:var(--pf-mut);font-size:13px;padding:14px;">No withdrawal requests yet.</div>'; return; }
      list.innerHTML = txs.map(t => `
        <div class="dep-row">
          <div>
            <div class="dep-amt">${fmt(t.amount)}</div>
            <div class="dep-sub">To: ${t.recipient_mobile || '—'} • Net ${fmt(t.net_amount)}<br>
              ${t.scheduled_for ? '📅 Payout: ' + new Date(t.scheduled_for).toLocaleString() : ''}<br>
              ${new Date(t.created_at).toLocaleString()}</div>
            </div>
          <span class="st ${t.status}">${t.status.toUpperCase()}</span>
        </div>`).join('');
      if (txs.some(t => t.status === 'pending')) document.getElementById('pendBanner').style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', async function () {
      SESSION = await AradelAuth.getSession();
      if (!SESSION) { window.location.href = '/'; return; }
      UID = SESSION.user.id;

      const { data: st } = await window.sb.from('platform_settings').select('*').eq('id', 1).single();
      if (st) {
        FEE_PCT = Number(st.withdrawal_fee_percent ?? 15);
        document.getElementById('feeNote').innerHTML = FEE_PCT + '% charge<br>applies per withdrawal';
        document.getElementById('insFeePct').textContent = FEE_PCT;
        document.getElementById('schedBanner').innerHTML = '📅 <b>Payout Schedule:</b> ' + (st.withdrawal_schedule_text || 'Mondays & Thursdays, 5:00 PM') + '. Requests are queued automatically for the next window.';
        if (st.otpay_country) document.getElementById('insCountry').value = st.otpay_country;
      }
      insCountryChanged(); insSummary();

      const { data: wallet } = await window.sb.from('wallets').select('balance').eq('user_id', UID).single();
      BALANCE = wallet ? Number(wallet.balance) : 0;
      document.getElementById('wdBalance').textContent = fmt(BALANCE);

      loadRequests();
    });
  </script>
</body>
</html>
