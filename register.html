<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Green Farm Fortune</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo-wrap">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="logo-text">GREEN FARM <span>FORTUNE</span></div>
      </div>
      <p class="auth-subtitle">Join the smart agriculture investment platform</p>
    </div>

    <div class="auth-card">
      <div id="errorAlert" class="alert alert-error"><span id="errorMessage"></span></div>
      
      <form id="registerForm">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="full_name" class="form-input" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="phone" class="form-input" placeholder="+237..." required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required />
        </div>
        <div class="form-group">
          <label class="form-label">Referral Code (Optional)</label>
          <input type="text" id="referral_code" class="form-input" placeholder="GFFXXXXX" />
        </div>
        <button type="submit" class="btn btn-gold" id="registerBtn">Create Account</button>
      </form>
    </div>

    <div class="auth-footer">
      Already have an account? <a href="index.html">Sign in</a>
    </div>
  </div>

  <div id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const full_name = document.getElementById('full_name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const referral_code = document.getElementById('referral_code').value;
      
      btn.disabled = true;
      btn.textContent = 'Creating account...';
      
      try {
        await AradelAuth.register(full_name, email, phone, password, referral_code);
        AradelAuth.toast('Account created! Please login.');
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (err) {
        const alert = document.getElementById('errorAlert');
        document.getElementById('errorMessage').textContent = err.message;
        alert.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
