<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033A0" />
  <title>Messages - Green Farm Fortune</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <style>
    :root { --pf-card: rgba(255,255,255,0.72); --pf-line: rgba(0,51,160,0.07); --pf-txt: #0E1B33; --pf-mut: #7A8699; }
    * { -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(180deg,#FFFBF0 0%,#FFF5E0 100%); background-attachment: fixed; font-family:'Inter',sans-serif; color:var(--pf-txt); margin:0; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .ms-wrap { max-width: 520px; margin: 0 auto; padding: 20px; }
    @keyframes rise { from { opacity:0; transform:translateY(16px);} to { opacity:1; transform:none;} }
    .rise { opacity:0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
    .d1{animation-delay:.05s;} .d2{animation-delay:.12s;}
    .sec-head h2 { font-size:19px; font-weight:800; margin:0 0 14px; }
    .ms-card { background:var(--pf-card); border:1px solid var(--pf-line); border-radius:18px; padding:16px; margin-bottom:10px; backdrop-filter:blur(10px); cursor:pointer; transition:transform .18s; position:relative; }
    .ms-card:active { transform:scale(.985); }
    .ms-card.unread { border-left:4px solid var(--gff-gold); background:rgba(255,255,255,.9); }
    .ms-top { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .ms-tag { font-size:9.5px; font-weight:800; padding:3px 9px; border-radius:8px; background:rgba(0,51,160,.08); color:var(--gff-blue); letter-spacing:.5px; }
    .ms-date { margin-left:auto; font-size:10.5px; color:var(--pf-mut); }
    .ms-dot { width:8px; height:8px; border-radius:50%; background:var(--gff-red); flex-shrink:0; }
    .ms-title { font-weight:800; font-size:14.5px; margin-bottom:4px; }
    .ms-body { font-size:13px; color:var(--pf-mut); line-height:1.6; display:none; white-space:pre-wrap; }
    .ms-card.open .ms-body { display:block; }
    .ms-preview { font-size:12.5px; color:var(--pf-mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ms-card.open .ms-preview { display:none; }
    .ms-empty { text-align:center; padding:40px 20px; background:var(--pf-card); border:2px dashed rgba(0,51,160,.12); border-radius:20px; color:var(--pf-mut); font-size:14px; }
    #toast { position:fixed; bottom:110px; left:50%; transform:translateX(-50%); background:var(--gff-blue-dark); color:#fff; padding:12px 24px; border-radius:25px; font-size:13px; font-weight:700; z-index:1000; opacity:0; pointer-events:none; transition:opacity .3s; }
    #toast.show { opacity:1; }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <div class="ms-wrap">
    <div class="sec-head rise d1"><h2>Messages</h2></div>
    <div id="msList" class="rise d2"></div>
  </div>
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let UID = null;

    async function openMsg(el, id, unread) {
      el.classList.toggle('open');
      if (unread) {
        await window.sb.from('messages').update({ is_read: true }).eq('id', id);
        el.classList.remove('unread');
        const dot = el.querySelector('.ms-dot');
        if (dot) dot.remove();
      }
    }

    document.addEventListener('DOMContentLoaded', async function () {
      const session = await AradelAuth.getSession();
      if (!session) { window.location.href = '/'; return; }
      UID = session.user.id;

      const { data: msgs } = await window.sb.from('messages')
        .select('*')
        .or('recipient_id.eq.' + UID + ',is_broadcast.eq.true')
        .order('created_at', { ascending: false })
        .limit(50);

      const list = document.getElementById('msList');
      if (!msgs || !msgs.length) {
        list.innerHTML = '<div class="ms-empty">📭 No messages yet.<br>Announcements from GFF admin will appear here.</div>';
        return;
      }

      list.innerHTML = msgs.map(m => `
        <div class="ms-card ${m.is_read ? '' : 'unread'}" onclick="openMsg(this,'${m.id}',${!m.is_read})">
          <div class="ms-top">
            <span class="ms-tag">${m.is_broadcast ? 'ANNOUNCEMENT' : 'DIRECT'}</span>
            <span class="ms-date">${new Date(m.created_at).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</span>
            ${m.is_read ? '' : '<span class="ms-dot"></span>'}
          </div>
          <div class="ms-title">${m.title}</div>
          <div class="ms-preview">${m.content}</div>
          <div class="ms-body">${m.content}</div>
        </div>`).join('');
    });
  </script>
</body>
</html>
